<svg xmlns="http://www.w3.org/2000/svg" width="700" height="478" viewBox="0 0 700 478" role="img" aria-labelledby="title"><title id="title">Fra browser til Ravens holdhistorik</title><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif">
<text x="24" y="39" font-size="25" font-weight="bold" fill="#162e43">Fra browser til Ravens holdhistorik</text>
<rect x="24" y="62" width="652" height="74" rx="8" fill="#edf5f6" stroke="#518286"/>
<text x="43" y="91" font-size="20" font-weight="bold" fill="#123e47">Browser → GameHubs Java-backend</text>
<text x="43" y="117" font-size="17" fill="#243744">Den indloggede bruger åbner GET /api/graph/players/9/teams.</text>
<path d="M350 136v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#166a71" stroke-width="3"/>
<rect x="24" y="163" width="652" height="74" rx="8" fill="#edf5f6" stroke="#518286"/>
<text x="43" y="192" font-size="20" font-weight="bold" fill="#123e47">GraphPlayerController → GraphPlayerService</text>
<text x="43" y="218" font-size="17" fill="#243744">Servicen sender spiller-id 9 videre til PlayerGraphRepository.</text>
<path d="M350 237v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#166a71" stroke-width="3"/>
<rect x="24" y="264" width="652" height="74" rx="8" fill="#edf5f6" stroke="#518286"/>
<text x="43" y="293" font-size="20" font-weight="bold" fill="#123e47">PlayerTeamHistoryReaderImpl → Neo4j</text>
<text x="43" y="319" font-size="17" fill="#243744">Find Player 9 og følg MEMBER_OF til holdene i datorækkefølge.</text>
<path d="M350 338v17 m-5 -5 l5 5 5 -5" fill="none" stroke="#166a71" stroke-width="3"/>
<rect x="24" y="365" width="652" height="74" rx="8" fill="#edf5f6" stroke="#518286"/>
<text x="43" y="394" font-size="20" font-weight="bold" fill="#123e47">PlayerTeamHistory → JSON i browseren</text>
<text x="43" y="420" font-size="17" fill="#243744">Svaret viser Raven med to perioder og en åben slutdato for Berlin Bears.</text>
</g></svg>
