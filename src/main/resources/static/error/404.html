<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 · GameHub</title>
    <link rel="stylesheet" href="/css/error.css">
</head>
<body>
    <main class="error-page">
        <a class="brand" href="/" aria-label="GameHub home"><span class="brand-mark">G</span> GAMEHUB</a>
        <section class="content" aria-labelledby="title">
            <div class="illustration" aria-hidden="true">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <span class="spark spark-one">✦</span><span class="spark spark-two">✧</span>
                <div class="portal"><span>?</span></div>
                <div class="planet-shadow"></div>
            </div>
            <div class="copy">
                <p class="eyebrow"><span></span> ERROR 404 · LOST IN THE RIFT</p>
                <h1 id="title">Looks like you<br><em>took a wrong turn.</em></h1>
                <p class="description">This page or team couldn't be found. Let's get you back in the game.</p>
                <div class="actions">
                    <a class="primary" href="/">Back to GameHub <span aria-hidden="true">↗</span></a>
                    <a class="secondary" href="/api/teams">View teams <span aria-hidden="true">→</span></a>
                </div>
            </div>
        </section>
        <footer><span>GAMEHUB <b> / </b> THE RIFT</span><span>RESPAWN &amp; TRY AGAIN <b>✦</b></span></footer>
    </main>
</body>
</html>
