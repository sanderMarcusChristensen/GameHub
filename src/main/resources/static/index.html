<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/" aria-label="GameHub home"><i aria-hidden="true">G</i>GAME<span>HUB</span></a>
    <a class="lookup" aria-current="page" href="/">Player lookup</a>
    <a class="account" href="/login.html">Sign in</a>
</header>
<main class="page lookup-page">
    <section class="hero">
        <p class="eyebrow">Global player statistics</p>
        <h1>Look up a pro <br>League of Legends player</h1>
        <p class="intro">Instant match data from the pro circuit. No account required.</p>
        <form id="player-form">
            <label for="player-name">Player name or slug</label>
            <div class="search-row"><input id="player-name" type="search" value="faker" required>
                <button type="submit">Get stats →</button></div>
            <button class="text-button" type="button" id="example">Try faker →</button>
        </form>
    </section>
    <p id="status" role="status"></p>
    <article id="result" class="panel" hidden>
        <header class="player-heading">
            <div><small class="accent">● Player found</small><h2 id="handle"></h2></div>
            <div><b id="games"></b><small>Matches played</small></div>
        </header>
        <div class="record">
            <section><small>Win rate</small><strong id="rate"></strong>
                <div class="track"><div id="bar"></div></div><p id="record"></p></section>
            <section><small>KDA ratio</small><strong id="kda"></strong>
                <div class="averages"><div><b id="kills"></b><small>Avg kills</small></div>
                <div><b id="deaths"></b><small>Avg deaths</small></div>
                <div><b id="assists"></b><small>Avg assists</small></div></div></section>
        </div>
        <footer><small>Data source</small> External pro match statistics</footer>
        <div id="metrics"></div>
    </article>
</main>
<script src="/js/app.js"></script>
</body>
</html>
