<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="page">
    <section class="hero">
        <p class="eyebrow">LEAGUE OF LEGENDS</p>
        <h1>GameHub</h1>
        <p class="intro">Look up a professional player and view their latest statistics.</p>

        <form id="player-form" class="search-form">
            <label for="player-name">Player name or slug</label>
            <div class="search-row">
                <input id="player-name" name="playerName" value="faker" placeholder="For example: faker" required>
                <button type="submit">Get stats</button>
            </div>
        </form>
    </section>

    <section class="result-card" aria-live="polite">
        <h2>Player statistics</h2>
        <p id="status">Enter a player name and press “Get stats”.</p>
        <pre id="result" hidden></pre>
    </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
