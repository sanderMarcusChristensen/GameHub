<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="page">
    <nav class="page-nav" aria-label="Account">
        <a class="nav-button" href="/login.html">Sign in</a>
    </nav>
    <section class="hero">
        <p class="eyebrow">LEAGUE OF LEGENDS</p>
        <h1>GameHub</h1>
        <p class="intro">Look up a professional player and view their latest statistics.</p>

        <form id="player-form" class="search-form">
            <label for="player-name">Player name or slug</label>
            <div class="search-row">
                <input id="player-name" name="playerName" value="faker" placeholder="For example: faker" required>
                <button type="submit">Get stats</button>
            </div>
        </form>
    </section>

    <section class="result-card">
        <h2>Player statistics</h2>
        <p id="status" role="status">Enter a player name and press “Get stats”.</p>
        <article id="result" hidden>
            <header class="player-heading"><h3 id="handle"></h3><span id="games"></span></header>
            <div class="record">
                <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
                    <circle cx="32" cy="32" r="26" class="track"/>
                    <circle cx="32" cy="32" r="26" pathLength="100" id="arc"/>
                </svg>
                <div><small>Win rate</small><strong id="rate"></strong><span id="record"></span></div>
                <div><small>⚔ KDA</small><strong id="kda"></strong><span id="kills"></span></div>
            </div>
            <div id="metrics"></div>
        </article>
    </section>
</main>

<script src="/js/app.js"></script>
</body>
</html>
