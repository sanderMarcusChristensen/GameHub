spring.application.name=gamehub
spring.config.import=optional:file:.env[.properties]

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

cito.api-key=${CITO_API_KEY}
# MongoDB Configuration
spring.mongodb.uri=${MONGODB_URI}
# Local Neo4j connection (override these values in the environment as needed)
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:gamehub-local-demo}

# MySQL Configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:gameHub}?connectionTimeZone=UTC
spring.datasource.username=${MYSQL_APP_USERNAME:gamehub_app}
spring.datasource.password=${MYSQL_APP_PASSWORD}
spring.jpa.open-in-view=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


#---
spring.config.activate.on-profile=migrate-neo4j | clear-neo4j
spring.main.web-application-type=none
spring.main.lazy-initialization=true
spring.autoconfigure.exclude=org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.data.mongodb.repositories.type=none
