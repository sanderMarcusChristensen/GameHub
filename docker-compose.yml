services:
  mysqldb:
    image: mysql:9.5.0
    container_name: mysqldb
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/database/init:/docker-entrypoint-initdb.d
    hostname: mysqldb

volumes:
  mysql_data:
