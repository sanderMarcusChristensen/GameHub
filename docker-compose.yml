
services:
  gamehub_db:
    image: mysql:9.5.0
    container_name: gamehub_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - gamehub_db_data:/var/lib/mysql
      - ./data/database/init:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:8.0
    container_name: gamehub_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_db_data_v2:/data/db

volumes:
  gamehub_db_data:
  mongo_db_data_v2:
